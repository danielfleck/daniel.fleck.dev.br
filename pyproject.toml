[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "daniel-fleck-site"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
]

[project.optional-dependencies]
audit = [
    "playwright>=1.40,<2",
]

[tool.setuptools]
packages = []

[tool.site]
static = true
public-root = "site"
docs-source = "mkdocs/docs"
docs-output = "site/docs"
docs-url = "https://daniel.fleck.dev.br/docs/"
